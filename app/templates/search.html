{% extends "base.html" %}
{% set active = "search" %}

{% block title %}Search — {{ app_name }}{% endblock %}

{% block header %}
<h1>Semantic Search</h1>
<p class="subtitle">Find relevant meeting minutes by meaning, not just keywords.</p>
{% endblock %}

{% block content %}
<section class="card">
  <div class="form-grid form-grid-3">
    <div class="field field-span-2">
      <label for="query">Search query</label>
      <input id="query" type="text" placeholder="e.g., vendor pilot timeline, data feed risks"/>
    </div>
    <div class="field">
      <label for="project">Project (optional)</label>
      <select id="project">
        <option value="">All projects</option>
      </select>
    </div>
  </div>
  <div class="form-grid" style="margin-top: 0;">
    <div class="field">
      <label for="limit">Results</label>
      <select id="limit">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="field field-action">
      <label>&nbsp;</label>
      <button id="search-btn" class="btn btn-primary btn-block">Search</button>
    </div>
  </div>
</section>

<div id="results" class="search-results"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/search.js"></script>
{% endblock %}
